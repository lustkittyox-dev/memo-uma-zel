
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoşuma Özel 💗</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(-45deg,#ffb6d1,#e9b5ff,#ffd6e7,#d9c2ff);
    background-size: 400% 400%;
    animation: bg 10s ease infinite;
    padding: 20px 0;
}

@keyframes bg {
    0% {background-position:0% 50%}
    50% {background-position:100% 50%}
    100% {background-position:0% 50%}
}

.card {
    width: 92%;
    max-width: 620px;
    padding: 35px 22px;
    background: rgba(255,255,255,.94);
    border: 2px solid white;
    border-radius: 30px;
    box-shadow: 0 15px 50px #a83c7850;
    text-align: center;
    position: relative;
    z-index: 2;
}

h1 {
    color: #df4284;
    font-size: 30px;
    line-height: 1.4;
}

p {
    color: #92516f;
    font-size: 19px;
    line-height: 1.5;
}

.small { font-size: 42px; }

button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover { transform: scale(1.06); }

.yes, .send, .restart {
    background: linear-gradient(135deg,#f45c9a,#d83d86);
    color: white;
}

.no {
    background: #eee;
    color: #777;
    position: absolute;
    left: 58%;
    top: 10px;
}

.buttons {
    position: relative;
    height: 115px;
    margin-top: 20px;
}

input, textarea {
    width: 100%;
    padding: 16px;
    border: 2px solid #f3b4ce;
    border-radius: 15px;
    outline: none;
    font-size: 17px;
    font-family: Arial, sans-serif;
    margin: 15px 0;
    resize: vertical;
    background: #fffafd;
}

textarea { min-height: 115px; }

input:focus, textarea:focus {
    border-color: #e74783;
}

.send { width: 100%; }

.error {
    color: #d83269;
    font-size: 14px;
    min-height: 20px;
}

.progress {
    color: #d85b91;
    font-size: 14px;
    margin-bottom: 15px;
}

.answer {
    background: #fff1f7;
    border-radius: 15px;
    padding: 14px;
    margin: 12px 0;
    text-align: left;
    color: #8c4565;
    overflow-wrap: anywhere;
}

.answer strong {
    display: block;
    color: #df4284;
    margin-bottom: 8px;
}

#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
}

.heart {
    position: fixed;
    bottom: -40px;
    animation: float 8s linear infinite;
    pointer-events: none;
}

@keyframes float {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>

<div id="hearts"></div>
<canvas id="fireworks"></canvas>

<div class="card">
    <div id="content">
        <div class="small">💗 🌸 💗</div>
        <h1>Memoşum merhaba!</h1>
        <p>Seni çok seviyorum! İyi ki varsın. 💕</p>
        <button class="yes" onclick="nextStep()">Devam et 💗</button>
    </div>
</div>

<script>
let step = 0;
let answers = [];

const questions = [
    "Bizim en mutlu anımız sence hangisiydi? 🥹",
    "Bana âşık olduğunu ilk ne zaman anladın? 💗",
    "Bizimle ilgili en büyük hayallerin neler? ✨",
    "Bende en sevdiğin özellik ne? 🌸",
    "Bana söylemek isteyip de henüz söylemediğin bir şey var mı? 💌"
];

const reactions = [
    "Bu anı ben de hiç unutmak istemiyorum! 💗",
    "Kalbinin sesini dinlediğin için iyi ki! 🥹",
    "Umarım bütün güzel hayallerimizi gerçekleştiririz! ✨",
    "Bunu duymak çok güzel! 💕",
    "Bu sözlerini saklamak isteyeceğim. 💌"
];

function nextStep() {
    step++;
    const content = document.getElementById("content");

    if (step === 1) {
        content.innerHTML = `
        <div class="small">🥹 💗</div>
        <h1>Sen de beni seviyor musun?</h1>
        <p>Doğru cevabı biliyorum ama yine de sorayım! 💕</p>
        <div class="buttons">
            <button class="yes" onclick="nextStep()">Evet 💗</button>
            <button class="no" id="no">Hayır 🙈</button>
        </div>`;
        makeNoRun();
    }

    else if (step === 2) {
        content.innerHTML = `
        <div class="small">👑 🌷</div>
        <h1>Dünyanın en güzel kadını Semina mı?</h1>
        <p>Bu sorunun cevabını biliyorsun! 😌</p>
        <div class="buttons">
            <button class="yes" onclick="showQuestion(0)">Evet 💗</button>
            <button class="no" id="no">Hayır 😏</button>
        </div>`;
        makeNoRun();
    }
}

function makeNoRun() {
    const no = document.getElementById("no");
    const area = document.querySelector(".buttons");

    function runAway() {
        const maxX = Math.max(0, area.clientWidth - no.offsetWidth);
        const maxY = Math.max(0, area.clientHeight - no.offsetHeight);

        no.style.left = Math.random() * maxX + "px";
        no.style.top = Math.random() * maxY + "px";
    }

    no.addEventListener("pointerenter", runAway);
    no.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        runAway();
    });
}

function showQuestion(index) {
    const content = document.getElementById("content");

    content.innerHTML = `
        <div class="small">💌</div>
        <div class="progress">SORU ${index + 1} / ${questions.length}</div>
        <h1>${questions[index]}</h1>
        <p>İçinden geldiği gibi cevapla, seni dinliyorum. 💗</p>
        <textarea id="answer" placeholder="Cevabını buraya yaz..."></textarea>
        <div class="error" id="error"></div>
        <button class="send" onclick="saveAnswer(${index})">
            Cevabımı gönder 💕
        </button>
    `;

    document.getElementById("answer").focus();
}

function saveAnswer(index) {
    const field = document.getElementById("answer");
    const value = field.value.trim();
    const error = document.getElementById("error");

    if (value.length === 0) {
        error.textContent = "Cevap vermeden geçemezsin! 💗";
        field.focus();
        return;
    }

    answers[index] = value;

    const content = document.getElementById("content");
    content.innerHTML = `
        <div class="small">🥰 💗</div>
        <h1>Cevabın alındı!</h1>
        <p>${reactions[index]}</p>
        <button class="yes" onclick="${
            index + 1 < questions.length
            ? `showQuestion(${index + 1})`
            : `showFinal()`
        }">
            ${index + 1 < questions.length ? "Sonraki soru 💕" : "Sürprizi gör 🎉"}
        </button>
    `;
}

function showFinal() {
    const content = document.getElementById("content");

    let summary = questions.map((question, i) => `
        <div class="answer">
            <strong>${question}</strong>
            ${escapeHTML(answers[i])}
        </div>
    `).join("");

    content.innerHTML = `
        <div class="small">🎉 👑 💗</div>
        <h1>DOĞRU CEVAP!</h1>
        <h1>MEMOŞUN SEMİNOSU! 💗</h1>
        <p>Bütün cevaplarını okudum. İyi ki varsın! 🌸</p>
        <h2 style="color:#df4284">Cevap defterin 💌</h2>
        ${summary}
        <button class="restart" onclick="restart()">Baştan başla 💕</button>
    `;

    startFireworks();
}

function escapeHTML(text) {
    return text.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function restart() {
    step = 0;
    answers = [];
    particles = [];
    fireworkStarted = false;
    cancelAnimationFrame(animationFrame);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    document.getElementById("content").innerHTML = `
        <div class="small">💗 🌸 💗</div>
        <h1>Memoşum merhaba!</h1>
        <p>Seni çok seviyorum! İyi ki varsın. 💕</p>
        <button class="yes" onclick="nextStep()">Devam et 💗</button>
    `;
}

// Uçuşan kalpler
const hearts = document.getElementById("hearts");

for (let i = 0; i < 22; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = ["💗","💕","💖","🌸"][i % 4];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDelay = Math.random() * 8 + "s";
    heart.style.fontSize = (18 + Math.random() * 20) + "px";
    hearts.appendChild(heart);
}

// Havai fişek
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];
let fireworkStarted = false;
let animationFrame;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function explode(x, y) {
    for (let i = 0; i < 65; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;

        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 100,
            color: `hsl(${Math.random() * 360},100%,65%)`
        });
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += .035;
        p.life--;

        ctx.globalAlpha = Math.max(0, p.life / 100);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) particles.splice(index, 1);
    });

    ctx.globalAlpha = 1;

    if (fireworkStarted || particles.length > 0) {
        animationFrame = requestAnimationFrame(animate);
    }
}

function startFireworks() {
    if (fireworkStarted) return;
    fireworkStarted = true;

    let count = 0;

    const interval = setInterval(() => {
        explode(
            Math.random() * canvas.width,
            Math.random() * canvas.height * .65
        );

        count++;

        if (count >= 20) {
            clearInterval(interval);
            fireworkStarted = false;
        }
    }, 350);

    animate();
}
</script>

</body>
</html>
